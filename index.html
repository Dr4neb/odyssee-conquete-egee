function makeVehicle(id,type,f,x,y){let c=VCFG[type], v={kind:'vehicle',id,type,name:c.name,faction:f,x,y,rotation:f==='ally'?0:Math.PI,destinationX:x,destinationY:y,selected:false,health:c.hp,maxHealth:c.hp,armorFront:c.af,armorSide:c.as,armorRear:c.ar,speed:c.speed,reverseSpeed:c.rev,acceleration:c.acc,turnRate:c.turnRate||c.turn,visionRange:c.vision,attackRange:c.range,damage:c.dmg,accuracy:c.accuracy,reloadTime:c.reload,ammo:c.ammo,fuel:c.fuel,transportCapacity:c.cap,passengers:[],state:'idle',vel:0,fireCD:0,hidden:false,g:new PIXI.Container()}; let g=v.g; world.addChild(g); let body=new PIXI.Graphics();g.addChild(body); let sel=new PIXI.Graphics();g.addChildAt(sel,0); let bars=new PIXI.Graphics();g.addChild(bars); v.draw=()=>{body.clear();sel.clear();bars.clear();let base=f==='ally'?0x2f9be6:0xd14938, dark=f==='ally'?0x1b577c:0x751e18;if(v.selected)sel.ellipse(0,0,50,32).stroke({color:0xffff66,width:3}); let len= type==='mbt'?70:type==='truck'||type==='ambulance'?66:56, wid= type==='mbt'?34:30; body.roundRect(-len/2,-wid/2,len,wid,5).fill(base).stroke({color:0x111111,width:2}); body.rect(-len/2+5,-wid/2+4,len-10,6).fill(dark); if(type==='mbt'||type==='ifv')body.rect(0,-4,len/2,8).fill(0x232323),body.circle(0,0,13).fill(dark); if(type==='ambulance'){body.rect(-8,-12,16,24).fill(0xffffff);body.rect(-3,-15,6,30).fill(0xff2222);body.rect(-15,-3,30,6).fill(0xff2222)} if(type==='truck')body.rect(-25,-12,28,24).fill(0x3b3b30); if(v.health<=0)body.alpha=.45;else body.alpha=1; bars.rect(-36,-32,72,6).fill(0x222);bars.rect(-36,-32,72*Math.max(0,v.health)/v.maxHealth,6).fill(0x58dd70);}; v.draw(); vehicles.push(v); return v}
drawMap(); [['A1',220,360],['A2',260,460],['A3',210,560],['A4',330,520]].forEach(a=>makeSquad(a[0],'ally',a[1],a[2])); makeSquad('CMD-A','ally',150,450,true);

function objective(id,x,y){let o={id,x,y,r:85,owner:'neutral',progress:0,g:new PIXI.Graphics()};world.addChild(o.g);objectives.push(o);o.flag=new PIXI.Graphics();world.addChild(o.flag);o.flag.x=x;o.flag.y=y-60;o.flag.rect(-3,0,6,50).fill(0x222);o.flag.poly([3,0,42,10,3,22]).fill(0xf3f0d0).stroke({color:0x222,width:2});return o}objective('OBJ ALPHA',1150,420);objective('OBJ BRAVO',1240,1180);
function fx(x,y,type){if(effects.length>100)return;let g=new PIXI.Graphics();world.addChild(g);effects.push({x,y,t:0,life:type==='boom'?1:.45,type,g})}
function updateFx(dt){for(let i=effects.length-1;i>=0;i--){let e=effects[i];e.t+=dt;e.g.clear();let a=1-e.t/e.life;if(e.type==='impact')e.g.circle(e.x,e.y,3+e.t*16).fill({color:0xffd27a,alpha:a});else if(e.type==='smoke')e.g.circle(e.x,e.y,8+e.t*22).fill({color:0x9b9b9b,alpha:a*.35});else e.g.circle(e.x,e.y,18+e.t*45).fill({color:0xff7b2e,alpha:a}); if(e.t>e.life){world.removeChild(e.g);effects.splice(i,1)}}}
function all(){return squads.concat(vehicles)} function alive(u){return u.health>0 && u.state!=='destroyed' && !u.passengerOf}
function selectableAt(p){let arr=all().filter(u=>u.faction==='ally'&&alive(u)); for(let i=arr.length-1;i>=0;i--) if(Math.hypot(arr[i].x-p.x,arr[i].y-p.y)<(arr[i].kind==='vehicle'?45:38))return arr[i]; return null}
function screenToWorld(e){let r=app.canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/cam.z+cam.x,y:(e.clientY-r.top)/cam.z+cam.y}}
function setSelected(u){all().forEach(x=>x.selected=false); selected=u; if(u)u.selected=true; updateHud()}
function order(p){if(!selected)return; selected.destinationX=clamp(p.x,20,W-20);selected.destinationY=clamp(p.y,20,H-20);selected.state= selected.kind==='vehicle'?'moving':'moving';fx(p.x,p.y,'impact'); if(selected.kind==='squad')selected.fatigue=clamp(selected.fatigue+5,0,100)}
app.canvas.addEventListener('contextmenu',e=>e.preventDefault());

app.canvas.addEventListener('wheel',e=>{e.preventDefault();let old=cam.z;cam.z=clamp(cam.z*(e.deltaY<0?1.12:.88),.45,1.6);let p=screenToWorld(e);cam.x=clamp(p.x-(e.clientX/app.screen.width)*(app.screen.width/cam.z),0,W-app.screen.width/cam.z);cam.y=clamp(p.y-(e.clientY/app.screen.height)*(app.screen.height/cam.z),0,H-app.screen.height/cam.z)},{passive:false});
window.addEventListener('keydown',e=>{if(selected?.kind==='squad'&&['1','2','3','4'].includes(e.key)){selected.formation=['line','column','wedge','spread'][+e.key-1];updateHud()} if(e.key==='s'&&selected){selected.destinationX=selected.x;selected.destinationY=selected.y;selected.state='idle'} if(e.key==='r'&&selected)retreat(selected)});
function moveSquad(s,dt){if(!alive(s))return;s.terrain=terrainAt(s.x,s.y);s.cover=T[s.terrain].c;let d=Math.hypot(s.destinationX-s.x,s.destinationY-s.y);let supMult=s.suppression>80?0:s.suppression>55?.45:s.suppression>25?.75:1;let cmd=commandBonus(s);let sp=s.speed*F[s.formation].speed*T[s.terrain].s*supMult*(1-s.fatigue*.004)*(cmd?1.06:1);if(d>3&&s.state!=='pinned'){s.x+=(s.destinationX-s.x)/d*sp*dt;s.y+=(s.destinationY-s.y)/d*sp*dt;s.fatigue=clamp(s.fatigue+2*dt,0,100);s.state=s.suppression>80?'pinned':'moving'}else{s.fatigue=clamp(s.fatigue-(s.cover!=='none'?7:4)*dt,0,100); if(s.state!=='engaging'&&s.state!=='capturing')s.state='idle'}s.suppression=clamp(s.suppression-(cmd?10:6)*dt,0,100);s.morale=clamp(s.morale+(cmd?4:1)*dt-(s.suppression>55?3*dt:0),0,100);if(s.morale<18)retreat(s)}
function moveVeh(v,dt){if(!alive(v))return;let d=Math.hypot(v.destinationX-v.x,v.destinationY-v.y), desired=d>8?ang(v,{x:v.destinationX,y:v.destinationY}):v.rotation;let da=Math.atan2(Math.sin(desired-v.rotation),Math.cos(desired-v.rotation));v.rotation+=clamp(da,-v.turnRate*dt,v.turnRate*dt);let tt=terrainAt(v.x,v.y), big=v.type==='mbt'||v.type==='ifv'||v.type==='apc';let tm={road:1.25,open:1,forest:big?.25:.45,rocks:big?.35:.55,urban:.65}[tt];let target=d>10?v.speed*tm:0;if(v.state==='disabled'||v.state==='destroyed')target=0;if(v.health<v.maxHealth*.45)target*=.65;v.vel += clamp(target-v.vel,-v.acceleration*dt,v.acceleration*dt);v.x+=Math.cos(v.rotation)*v.vel*dt;v.y+=Math.sin(v.rotation)*v.vel*dt;if(d<12)v.state='idle';else v.state='moving'; if(v.vel>30&&Math.random()<dt*2)fx(v.x-Math.cos(v.rotation)*28,v.y-Math.sin(v.rotation)*28,'smoke'); if(v.type==='ambulance')squads.filter(s=>s.faction===v.faction&&alive(s)&&dist(s,v)<VCFG.ambulance.heal).forEach(s=>{s.health=clamp(s.health+3*dt,0,s.maxHealth);s.morale=clamp(s.morale+5*dt,0,100)})}
function commandBonus(u){return squads.some(c=>c.command&&c.faction===u.faction&&alive(c)&&c!==u&&dist(c,u)<220)}
function armorDamage(v,from,dmg){let hit=Math.atan2(Math.sin(ang(v,from)-v.rotation),Math.cos(ang(v,from)-v.rotation));let a=Math.abs(hit)<Math.PI/4?v.armorFront:Math.abs(hit)>Math.PI*3/4?v.armorRear:v.armorSide;return Math.max(1,dmg-a)}
function visibleEnemies(u){return all().filter(e=>e.faction!==u.faction&&alive(e)&&dist(u,e)<u.visionRange)}
function combat(u,dt){if(!alive(u)||u.state==='retreating'||u.damage<=0)return;u.fireCD=Math.max(0,u.fireCD-dt);let es=visibleEnemies(u).sort((a,b)=>dist(u,a)-dist(u,b));let t=es.find(e=>dist(u,e)<u.attackRange);if(!t)return;u.state='engaging'; if(u.fireCD>0)return;u.fireCD=u.kind==='vehicle'?u.reloadTime:.8; let acc=u.accuracy*(u.kind==='squad'?F[u.formation].acc*(1-u.suppression*.006)*(1-u.fatigue*.003):1); if(commandBonus(u))acc*=1.08; if(Math.random()<acc){let dmg=u.damage;if(t.kind==='squad'){let terr=T[terrainAt(t.x,t.y)];dmg*=terr.d*F[t.formation]?.vuln||1;t.suppression=clamp(t.suppression+12*terr.sup,0,100);t.morale=clamp(t.morale-5,0,100)}else dmg=armorDamage(t,u,dmg);t.health-=dmg;fx(t.x+(Math.random()-.5)*25,t.y+(Math.random()-.5)*25,'impact'); if(t.health<=0){t.health=0;t.state=t.kind==='vehicle'?'destroyed':'dead';fx(t.x,t.y,'boom'); if(t.kind==='vehicle')t.passengers.forEach(p=>{p.passengerOf=null;p.x=t.x+Math.random()*50-25;p.y=t.y+Math.random()*50-25;p.health*=.65;p.g.visible=true});}}else{if(t.kind==='squad')t.suppression=clamp(t.suppression+5,0,100);fx(t.x+Math.random()*40-20,t.y+Math.random()*40-20,'smoke')} if(u.ammo>0)u.ammo--}

function ai(dt){all().filter(u=>u.faction==='enemy'&&alive(u)).forEach(u=>{let es=visibleEnemies(u); if(u.kind==='squad'){if(u.morale<20||u.suppression>80){retreat(u);return} if(es[0]){let t=es[0]; if(dist(u,t)>u.attackRange*.85){u.destinationX=t.x-120;u.destinationY=t.y+80} } else if(Math.random()<dt*.08){let o=objectives[Math.floor(Math.random()*objectives.length)];u.destinationX=o.x+Math.random()*100-50;u.destinationY=o.y+Math.random()*100-50}} else {if(u.health<u.maxHealth*.25){retreat(u);return} if(u.type==='ambulance'){let friend=all().filter(f=>f.faction==='enemy'&&alive(f)&&f.health<f.maxHealth).sort((a,b)=>a.health/a.maxHealth-b.health/b.maxHealth)[0]; if(friend){u.destinationX=friend.x-120;u.destinationY=friend.y}} else if(es[0]){let t=es[0],side=u.type==='humvee'||u.type==='ifv'?120:0;if(dist(u,t)>u.attackRange*.8){u.destinationX=t.x-side;u.destinationY=t.y+side}} else if(Math.random()<dt*.05){u.destinationX=1600+Math.random()*500;u.destinationY=500+Math.random()*600}}})}
function objectivesUpdate(dt){objectives.forEach(o=>{let near=squads.filter(s=>alive(s)&&dist(s,o)<o.r&&!s.passengerOf);let a=near.filter(s=>s.faction==='ally').length,e=near.filter(s=>s.faction==='enemy').length;if(a!==e&&near.length){let side=a>e?'ally':'enemy';o.progress+=dt*(side==='ally'?1:-1)*(near.some(s=>s.command)?1.45:1); if(o.progress>4){o.owner='ally';o.progress=4} if(o.progress<-4){o.owner='enemy';o.progress=-4}}else o.progress*=.985;o.g.clear();let col=o.owner==='ally'?0x3399ff:o.owner==='enemy'?0xdd4433:0xd4d4d4;o.g.circle(o.x,o.y,o.r).fill({color:col,alpha:.12}).stroke({color:col,width:4});o.g.rect(o.x-50,o.y-6,100,12).fill(0x111);o.g.rect(o.x-50,o.y-6,50+o.progress/4*50,12).fill(col)})}
function embark(){if(!selected)return;if(selected.kind==='squad'){let v=vehicles.find(v=>v.faction==='ally'&&alive(v)&&v.transportCapacity>v.passengers.length&&dist(v,selected)<80); if(v){v.passengers.push(selected);selected.passengerOf=v;selected.g.visible=false;setSelected(v)}}}
function disembark(){if(selected?.kind!=='vehicle'||!selected.passengers.length)return;let p=selected.passengers.pop();p.passengerOf=null;p.x=selected.x+Math.random()*70-35;p.y=selected.y+Math.random()*70-35;p.destinationX=p.x;p.destinationY=p.y;p.g.visible=true;setSelected(p)}
function updateHud(){let info=document.getElementById('info'), btn=document.getElementById('buttons');btn.innerHTML=''; if(!selected){info.innerHTML='<div class="title">Aucune sélection</div><div class="small">Sélectionne une escouade ou un véhicule allié.</div>';return} let u=selected; let bars=(n,val,cls='fill')=>`${n}<div class="bar"><div class="${cls}" style="width:${clamp(val,0,100)}%"></div></div>`; if(u.kind==='squad'){info.innerHTML=`<div class="title">${u.command?'Commandant ':'Escouade '}${u.id}</div><div class="small">${bars('Santé',u.health/u.maxHealth*100)}${bars('Moral',u.morale,'mor')}${bars('Suppression',u.suppression,'sup')}${bars('Fatigue',u.fatigue,'fat')}Formation: ${u.formation}<br/>État: ${u.state}<br/>Terrain: ${terrainAt(u.x,u.y)} / Couverture: ${u.cover}<br/>Munitions: ${u.ammo}</div>`; ['line','column','wedge','spread'].forEach(f=>{let b=document.createElement('button');b.textContent=f;b.onclick=()=>{u.formation=f;updateHud()};btn.appendChild(b)}); let e=document.createElement('button');e.textContent='Embark';e.onclick=embark;btn.appendChild(e)} else {info.innerHTML=`<div class="title">${u.name}</div><div class="small">${bars('Santé',u.health/u.maxHealth*100)}Blindage F/S/R: ${u.armorFront}/${u.armorSide}/${u.armorRear}<br/>État: ${u.state}<br/>Munitions: ${u.ammo} | Fuel: ${Math.round(u.fuel)}<br/>Passagers: ${u.passengers.length}/${u.transportCapacity}<br/>Arme: ${u.damage?u.damage+' dmg':'aucune'} | Vitesse: ${Math.round(u.vel)}</div>`; ['Stop','Reverse','Embark','Disembark'].forEach(name=>{let b=document.createElement('button');b.textContent=name;b.onclick=()=>{if(name==='Stop'){u.destinationX=u.x;u.destinationY=u.y} if(name==='Reverse'){u.destinationX=u.x-Math.cos(u.rotation)*120;u.destinationY=u.y-Math.sin(u.rotation)*120} if(name==='Embark')embark(); if(name==='Disembark')disembark();};btn.appendChild(b)})} let r=document.createElement('button');r.textContent='Repli';r.onclick=()=>retreat(u);btn.appendChild(r)}
app.ticker.add(t=>{let dt=Math.min(.05,t.deltaMS/1000);all().forEach(u=>{if(u.passengerOf){u.x=u.passengerOf.x;u.y=u.passengerOf.y} });squads.forEach(s=>moveSquad(s,dt));vehicles.forEach(v=>moveVeh(v,dt));all().forEach(u=>combat(u,dt));ai(dt);objectivesUpdate(dt);updateFx(dt);world.x=-cam.x*cam.z;world.y=-cam.y*cam.z;world.scale.set(cam.z);all().forEach(u=>{u.g.position.set(u.x,u.y);u.g.rotation=u.kind==='vehicle'?u.rotation:0;u.hidden=u.faction==='enemy'&&!squads.concat(vehicles).some(a=>a.faction==='ally'&&alive(a)&&dist(a,u)<a.visionRange);u.g.alpha=u.hidden?.22:1;u.draw&&u.draw()}); if(selected)updateHud()});
setSelected(null);
})();
</script>
