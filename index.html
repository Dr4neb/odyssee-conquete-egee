<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RTS Militaire Moderne - v0.1 Fondation</title>
  <style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

#game-root {
  width: 100vw;
  height: 100vh;
  position: relative;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
  touch-action: none;
}

#hud {
  position: absolute;
  left: 12px;
  right: 12px;
  top: 12px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  pointer-events: none;
  color: #e8eee8;
  z-index: 10;
}

.hud-panel {
  background: rgba(16, 24, 18, 0.78);
  border: 1px solid rgba(180, 220, 180, 0.25);
  border-radius: 10px;
  padding: 10px 12px;
  backdrop-filter: blur(6px);
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 13px;
}

.controls {
  text-align: right;
}

@media (max-width: 720px) {
  #hud {
    flex-direction: column;
    top: 8px;
    left: 8px;
    right: 8px;
  }

  .controls {
    text-align: left;
    font-size: 12px;
  }
}

  </style>
</head>
<body>
  <div id="game-root">
    <div id="hud">
      <div class="hud-panel">
        <strong>RTS Militaire Moderne</strong>
        <span id="selection-label">Aucune escouade sélectionnée</span>
      </div>
      <div class="hud-panel controls">
        <span>Desktop : clic gauche sélectionner, clic droit déplacer, molette zoom</span>
        <span>Mobile : tap sélectionner, tap terrain déplacer, glisser caméra</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
  <script>

const { Application, Container, Graphics } = PIXI;

class Renderer {
  constructor(root) {
    this.root = root;
    this.app = new Application();
  }

  async init() {
    await this.app.init({
      resizeTo: window,
      background: "#1b2419",
      antialias: true,
      resolution: Math.min(window.devicePixelRatio || 1, 2),
      autoDensity: true,
    });

    this.root.prepend(this.app.canvas);
  }
}

class Camera {
  constructor(app) {
    this.app = app;
    this.world = new Container();
    this.zoom = 1;
    this.minZoom = 0.55;
    this.maxZoom = 1.75;

    app.stage.addChild(this.world);
    this.centerOn(600, 420);
  }

  centerOn(x, y) {
    this.world.position.set(
      this.app.screen.width / 2 - x * this.zoom,
      this.app.screen.height / 2 - y * this.zoom,
    );
    this.world.scale.set(this.zoom);
  }

  pan(dx, dy) {
    this.world.position.x += dx;
    this.world.position.y += dy;
  }

  setZoom(nextZoom, screenPoint) {
    const worldBefore = this.screenToWorld(screenPoint);
    this.zoom = Math.max(this.minZoom, Math.min(this.maxZoom, nextZoom));
    this.world.scale.set(this.zoom);
    const worldAfter = this.screenToWorld(screenPoint);

    this.world.position.x += (worldAfter.x - worldBefore.x) * this.zoom;
    this.world.position.y += (worldAfter.y - worldBefore.y) * this.zoom;
  }

  screenToWorld(point) {
    return {
      x: (point.x - this.world.position.x) / this.zoom,
      y: (point.y - this.world.position.y) / this.zoom,
    };
  }
}

class Input {
  constructor(app, camera) {
    this.app = app;
    this.camera = camera;
    this.onPrimaryTap = null;
    this.onSecondaryTap = null;
    this.dragging = false;
    this.dragStart = null;
    this.lastPoint = null;
    this.hasMoved = false;

    app.stage.eventMode = "static";
    app.stage.hitArea = app.screen;

    app.stage.on("pointerdown", (event) => this.pointerDown(event));
    app.stage.on("pointermove", (event) => this.pointerMove(event));
    app.stage.on("pointerup", (event) => this.pointerUp(event));
    app.stage.on("pointerupoutside", (event) => this.pointerUp(event));

    app.canvas.addEventListener("contextmenu", (event) => event.preventDefault());
    app.canvas.addEventListener("wheel", (event) => this.wheel(event), { passive: false });
  }

  getPoint(event) {
    return { x: event.global.x, y: event.global.y };
  }

  pointerDown(event) {
    this.dragging = true;
    this.dragStart = this.getPoint(event);
    this.lastPoint = this.getPoint(event);
    this.hasMoved = false;
  }

  pointerMove(event) {
    if (!this.dragging) return;

    const point = this.getPoint(event);
    const dx = point.x - this.lastPoint.x;
    const dy = point.y - this.lastPoint.y;

    if (Math.hypot(point.x - this.dragStart.x, point.y - this.dragStart.y) > 8) {
      this.hasMoved = true;
      this.camera.pan(dx, dy);
    }

    this.lastPoint = point;
  }

  pointerUp(event) {
    if (!this.dragging) return;

    const point = this.getPoint(event);
    const worldPoint = this.camera.screenToWorld(point);

    if (!this.hasMoved) {
      if (event.button === 2) this.onSecondaryTap?.(worldPoint);
      else this.onPrimaryTap?.(worldPoint);
    }

    this.dragging = false;
  }

  wheel(event) {
    event.preventDefault();
    const direction = event.deltaY > 0 ? -1 : 1;
    this.camera.setZoom(this.camera.zoom + 0.12 * direction, {
      x: event.clientX,
      y: event.clientY,
    });
  }
}

class Grid {
  constructor(width, height, cellSize) {
    this.graphics = new Graphics();

    for (let x = 0; x <= width; x += cellSize) {
      this.graphics.moveTo(x, 0).lineTo(x, height).stroke({ width: 1, color: 0x334330, alpha: 0.42 });
    }

    for (let y = 0; y <= height; y += cellSize) {
      this.graphics.moveTo(0, y).lineTo(width, y).stroke({ width: 1, color: 0x334330, alpha: 0.42 });
    }
  }
}

class TacticalMap {
  constructor() {
    this.container = new Container();
    this.width = 1800;
    this.height = 1200;

    this.drawGround();
    this.container.addChild(new Grid(this.width, this.height, 80).graphics);
    this.drawCoverBlocks();
  }

  drawGround() {
    const ground = new Graphics();
    ground.rect(0, 0, this.width, this.height).fill(0x253222);
    this.container.addChild(ground);
  }

  drawCoverBlocks() {
    const cover = new Graphics();

    const blocks = [
      [300, 240, 220, 60],
      [920, 360, 280, 70],
      [650, 760, 180, 95],
      [1250, 650, 240, 80],
    ];

    for (const [x, y, w, h] of blocks) {
      cover.roundRect(x, y, w, h, 8).fill(0x59624d).stroke({ width: 2, color: 0x768166 });
    }

    this.container.addChild(cover);
  }
}

class Soldier {
  constructor(offsetX, offsetY) {
    this.offsetX = offsetX;
    this.offsetY = offsetY;
    this.graphics = new Graphics();
    this.draw(0x9fb37f);
  }

  draw(color) {
    this.graphics.clear();
    this.graphics.circle(0, 0, 8).fill(color).stroke({ width: 2, color: 0x263321 });
  }

  setSelected(isSelected) {
    this.draw(isSelected ? 0xd7f59a : 0x9fb37f);
  }
}

class Squad {
  constructor({ id, name, x, y }) {
    this.id = id;
    this.name = name;
    this.position = { x, y };
    this.target = null;
    this.speed = 145;
    this.selected = false;
    this.radius = 42;
    this.container = new Container();
    this.selectionRing = new Graphics();
    this.soldiers = [
      new Soldier(-18, -14),
      new Soldier(18, -14),
      new Soldier(-18, 14),
      new Soldier(18, 14),
    ];

    this.container.position.set(x, y);
    this.container.addChild(this.selectionRing);

    for (const soldier of this.soldiers) {
      soldier.graphics.position.set(soldier.offsetX, soldier.offsetY);
      this.container.addChild(soldier.graphics);
    }

    this.drawSelectionRing();
  }

  containsPoint(point) {
    return Math.hypot(point.x - this.position.x, point.y - this.position.y) <= this.radius;
  }

  setSelected(isSelected) {
    this.selected = isSelected;
    for (const soldier of this.soldiers) soldier.setSelected(isSelected);
    this.drawSelectionRing();
  }

  drawSelectionRing() {
    this.selectionRing.clear();
    if (!this.selected) return;
    this.selectionRing.circle(0, 0, this.radius).stroke({ width: 3, color: 0xb6ff7a, alpha: 0.95 });
  }

  syncContainer() {
    this.container.position.set(this.position.x, this.position.y);
  }
}

class UnitFactory {
  static createSquad(config) {
    return new Squad(config);
  }
}

class SelectionSystem {
  constructor() {
    this.current = null;
  }

  select(unit) {
    if (this.current) this.current.setSelected(false);
    this.current = unit;
    this.current.setSelected(true);
  }

  clear() {
    if (this.current) this.current.setSelected(false);
    this.current = null;
  }

  update() {}
}

class MovementSystem {
  moveSquadTo(squad, point) {
    squad.target = { x: point.x, y: point.y };
  }

  update(units, dt) {
    for (const unit of units) {
      if (!unit.target) continue;

      const dx = unit.target.x - unit.position.x;
      const dy = unit.target.y - unit.position.y;
      const distance = Math.hypot(dx, dy);

      if (distance < 3) {
        unit.target = null;
        continue;
      }

      const step = Math.min(distance, unit.speed * dt);
      unit.position.x += (dx / distance) * step;
      unit.position.y += (dy / distance) * step;
      unit.syncContainer();
    }
  }
}

class AISystem {
  update(units, dt) {
    // v0.1 : IA volontairement minimale.
    // Les prochaines versions géreront suppression, couverture, moral et réactions tactiques.
  }
}

class HUD {
  constructor(selectionLabel) {
    this.selectionLabel = selectionLabel;
  }

  setSelected(unit) {
    this.selectionLabel.textContent = `${unit.name} sélectionnée`;
  }

  clear() {
    this.selectionLabel.textContent = "Aucune escouade sélectionnée";
  }
}

class Game {
  constructor({ root, selectionLabel }) {
    this.root = root;
    this.renderer = new Renderer(root);
    this.camera = null;
    this.input = null;
    this.map = null;
    this.units = [];
    this.selection = new SelectionSystem();
    this.movement = new MovementSystem();
    this.ai = new AISystem();
    this.hud = new HUD(selectionLabel);
  }

  async start() {
    await this.renderer.init();

    this.camera = new Camera(this.renderer.app);
    this.map = new TacticalMap();
    this.input = new Input(this.renderer.app, this.camera);

    this.camera.world.addChild(this.map.container);

    this.units = [
      UnitFactory.createSquad({ id: "alpha", name: "Escouade Alpha", x: 450, y: 360 }),
      UnitFactory.createSquad({ id: "bravo", name: "Escouade Bravo", x: 760, y: 520 }),
    ];

    for (const unit of this.units) {
      this.camera.world.addChild(unit.container);
    }

    this.input.onPrimaryTap = (worldPoint) => this.handlePrimaryTap(worldPoint);
    this.input.onSecondaryTap = (worldPoint) => this.handleMoveCommand(worldPoint);

    this.renderer.app.ticker.add((ticker) => this.update(ticker.deltaMS / 1000));
  }

  handlePrimaryTap(worldPoint) {
    const unit = this.units.find((candidate) => candidate.containsPoint(worldPoint));

    if (unit) {
      this.selection.select(unit);
      this.hud.setSelected(unit);
      return;
    }

    if (this.selection.current) {
      this.handleMoveCommand(worldPoint);
    }
  }

  handleMoveCommand(worldPoint) {
    const selected = this.selection.current;
    if (!selected) return;
    this.movement.moveSquadTo(selected, worldPoint);
  }

  update(dt) {
    this.ai.update(this.units, dt);
    this.movement.update(this.units, dt);
    this.selection.update();
  }
}

(async () => {
  const game = new Game({
    root: document.getElementById("game-root"),
    selectionLabel: document.getElementById("selection-label"),
  });

  await game.start();
})();

  </script>
</body>
</html>
